apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

def apikeyProperties = new Properties()
apikeyProperties.load(new FileInputStream(rootProject.file("apikey.properties")))

android {
    compileSdkVersion 36
    defaultConfig {
        applicationId 'com.github.kaiwinter.nfcsonos'
        minSdkVersion 23 // Retrofit
        targetSdkVersion 34
        versionCode = 23
        versionName = "1.6.1-SNAPSHOT"

        buildConfigField("String", "CLIENT_ID", apikeyProperties['CLIENT_ID'])
        buildConfigField("String", "CLIENT_SECRET", apikeyProperties['CLIENT_SECRET'])
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = 17
    }
    namespace 'com.github.kaiwinter.nfcsonos'
}

configurations {
    cleanedAnnotations
    compile.exclude group: 'org.jetbrains', module: 'annotations'
}

dependencies {
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'
    implementation "androidx.preference:preference-ktx:1.2.1"

    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.github.bumptech.glide:glide:5.0.7'
    implementation 'de.psdev.licensesdialog:licensesdialog:2.2.0'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.4.0'

    // Test
    testImplementation 'junit:junit:4.13.2'
    testImplementation("org.robolectric:robolectric:4.16.1")
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.4.0'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.awaitility:awaitility:4.3.0'
}
